name: Build Infrastructure Runner

on:
  push:
    branches: [ "master" ]
    paths:
      - 'dockerfiles/infrastructure-runner/**'

permissions:
  packages: write
  contents: read

jobs:
  build-infrastructure-runner:
    runs-on: ubuntu-latest 

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push infrastructure-runner
        uses: docker/build-push-action@v5
        with:
          context: ./dockerfiles/infrastructure-runner
          push: true
          tags: ghcr.io/klaudiuszsoltysik/infrastructure-runner:latest